# Hardware
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED=y

# Console / logging (USB-powered bench debug mode)
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_BUFFER_SIZE=4096

# Float printf
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# BLE
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="SPINEGUARD_NODE1"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_NUS=y
CONFIG_BT_DATA_LEN_UPDATE=y
CONFIG_BT_PHY_UPDATE=y
CONFIG_BT_BUF_ACL_TX_SIZE=217
CONFIG_BT_BUF_ACL_RX_SIZE=217
CONFIG_BT_L2CAP_TX_MTU=212

# Settings
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_ZMS=y

# DK LEDs
CONFIG_DK_LIBRARY=y

# Stack sizes — critical for MPSL stability
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MPSL_WORK_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_BT_HCI_TX_STACK_SIZE=2048

CONFIG_DEBUG_OPTIMIZATIONS=n
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_REGULATOR=y
CONFIG_TFM_SECURE_UART=n
CONFIG_BOOT_DELAY=1000




#
# Optional
#
CONFIG_REBOOT=n

#######################################
# TensorFlow Lite Micro
#######################################

CONFIG_CPP=y
CONFIG_STD_CPP17=y


CONFIG_REQUIRES_FLOAT_PRINTF=y

# Increase heap for development
CONFIG_HEAP_MEM_POOL_SIZE=131072